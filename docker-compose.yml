version: '3.8'

services:
  pointofsale-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pointofsale-sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=PointOfSale@2026
    ports:
      - "1433:1433"
    volumes:
      - pointofsale_sql_data:/var/opt/mssql

volumes:
  pointofsale_sql_data: